<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<h1>Login</h1>

<div class="form-container">
    <form action="efetuar-login" method="post">
    <label>Email:</label>
    <input type="text" id="email" name="email" required>

    <label>Senha:</label>
    <input type="password" id="senha" name="senha" required>

    <button class="btn-if" id="btn-login" type="submit">Entrar</button>

    </form>
    <a href="cadastro.html" class="link-if">Ainda não tenho conta — cadastrar</a>
</div>

</body>
</html>

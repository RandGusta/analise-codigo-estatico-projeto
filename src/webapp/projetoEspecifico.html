<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Projeto</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<h1>Projeto: Nome do Projeto</h1>
<br><br>
<h3>Selecione os arquivos para analisar:</h3>
<br><br>

<div class="lista-arquivos" id="lista-arquivos"></div>

<br><br>
<button class="btn-if" id="btn-analisar-selecionados">
    Analisar Selecionados
</button>
<br><br>

<!-- Upload -->
<form id="form-upload" action="/upload-arquivo" method="post" enctype="multipart/form-data">
    <input type="file" id="arquivo" name="arquivo" style="display:none;" required>
    <button class="btn-if" type="button" id="btn-adicionar">Adicionar arquivo</button>
</form>

<script>
    const inputArquivo = document.getElementById('arquivo');
    const btnAdicionar = document.getElementById('btn-adicionar');
    const form = document.getElementById('form-upload');
    const listaArquivos = document.getElementById('lista-arquivos');

    btnAdicionar.addEventListener('click', () => {
        inputArquivo.click();
    });

    inputArquivo.addEventListener('change', () => {
        if(inputArquivo.files.length > 0){
            const arquivo = inputArquivo.files[0];
            const nome = arquivo.name;
            const extensao = nome.split('.').pop().toLowerCase();

            if(extensao !== 'js'){
                alert('Apenas arquivos .js são permitidos!');
                inputArquivo.value = '';
                return;
            }

            // Adiciona visualmente na lista
            adicionarArquivoNaLista(arquivo.name);

            // Envia para o backend
            form.submit();
        }
    });

    // Função para criar o item visual na lista
    function adicionarArquivoNaLista(nomeArquivo){
        const linha = document.createElement('div');
        linha.className = 'linha-arquivo';

        const span = document.createElement('span');
        span.textContent = nomeArquivo;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'chk-arquivo';
        checkbox.value = nomeArquivo;
        checkbox.checked = true;

        linha.appendChild(span);
        linha.appendChild(checkbox);
        listaArquivos.appendChild(linha);
    }


    document.getElementById("btn-analisar-selecionados").addEventListener("click", async () => {

        // pega os arquivos marcados
        const selecionados = Array.from(
            document.querySelectorAll(".chk-arquivo:checked")
        ).map(chk => chk.value);

        if(selecionados.length === 0){
            alert("Selecione pelo menos um arquivo!");
            return;
        }

        // envia para o backend do seu AnalysisController
        await fetch("/analisar-arquivos", {
            method: "POST",
            headers: { "Content-Type": "application/json"},
            body: JSON.stringify({ arquivos: selecionados })
        });

        // redireciona
        window.location.href = "ocorrencias.html";
    });
</script>

<br>
<a href="projetosGerais.jsp" class="link-if">Voltar aos Projetos</a>

</body>
</html>

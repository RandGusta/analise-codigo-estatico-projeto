<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
<h1>Cadastro</h1>
<div class="form-container">
    <form action = "/cadastrar-usuario" method ="post">
        <label>Nome:</label>
        <input type="text" id="nome"  name = "nome" required>

        <label>Email:</label>
        <input type="email" id="email" name="email" required>

        <label>Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button class="btn-if" id="btn-cadastrar">Cadastrar</button>
    </form>
    <p id="erro" style="color:red; display:none;">Erro ao tentar cadastrar email ou senha!</p>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.get('erro') === 'true') {
            document.getElementById('erro').style.display = 'block';
        }
    </script>
    <a href="login.html" class="link-if">Já tenho conta — fazer login</a>
</div>
</body>
</html>
